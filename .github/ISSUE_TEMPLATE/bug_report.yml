name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! **Never paste API keys, secrets, or account numbers.**
  - type: input
    id: version
    attributes:
      label: PortfolioOS version
      placeholder: "0.1.0 (shown in the sidebar and Settings → About)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Windows, Linux]
    validations:
      required: true
  - type: dropdown
    id: broker
    attributes:
      label: Broker connection involved
      options: [Demo Mode, Alpaca Paper, Tradier Sandbox, Interactive Brokers, Manual Portfolio, Not broker-related]
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, what you saw. Include the expandable "Technical details" text from any error message.
    validations:
      required: true
